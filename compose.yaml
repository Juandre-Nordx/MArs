services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mars
      POSTGRES_PASSWORD: mars
      POSTGRES_DB: mars
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - mars-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mars -d mars']
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://mars:mars@db:5432/mars?schema=public
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy
volumes:
  mars-db:
